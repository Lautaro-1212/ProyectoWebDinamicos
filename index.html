<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Stock Master</title>
    <link rel="icon" type="image/png" href="assets/Logo.png">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/colores.css">
    <link rel="stylesheet" href="CSS/header.css">
    <link rel="stylesheet" href="CSS/filas.css">
    <link rel="stylesheet" href="CSS/pop-up.css">
</head>
<body>
    <div class="contenedor" id="contenedor">
        <div class="header"> 
            <img src="assets/Logo.png" class="logo">
            <h1 class="title">Lista de productos</h1>

            <button commandfor="info" command ="show-modal" class="button">Agregar productos</button>
            <dialog id="info" class="up">
                <div>
                    <p class="pop"> Agregue un nuevo producto</p>
                </div>
            
                <div>
                    <label class="texto">Nombre </label>
                    <input type="text" class="inputs" placeholder="Ingrese el nombre del producto"></input>
                </div><br>

                <div>
                    <label style="margin-right: 8px;" class="texto">Codigo</label>
                    <input type="text" class="inputs" placeholder="Ingrese el codigo del producto"></input>
                </div><br>

                <div>
                    <label style="margin-right: 15px;" class="texto">Precio </label>
                    <input type="text" class="inputs" placeholder="Ingrese el precio del producto"></input>
                </div><br>

                <div>
                    <label style="margin-right: 20px;"class="texto">Stock </label>
                    <input type="text" class="inputs" placeholder="Ingrese el stock del producto"></input>
                </div>

                <button commandfor="info" command="close" class="botones">
                    <p>Confirmar</p>
                </button> 
                
                <button commandfor="info" command="close" class="botones">
                    <p>Cancelar</p>
                </button> 
            </dialog>
        </div>

        <div class="columna">
            <div class="item">ID</div>
            <div class="item">Código</div>
            <div class="item">Nombre</div>
            <div class="item">Precio</div>
            <div class="item">Stock</div>
            <div class="item">Accion</div>
        </div>

        <div class="fila">
            <div class="item">1</div>
            <div class="item">2141</div>
            <div class="item">Ravioles</div>
            <div class="item">2000$</div>
            <div class="item">2000</div>
            <div class="filaAccion">
                <button class="botonesAccion">Modifcar</button>
                <button class="botonesAccion">Eliminar</button>
            </div>
        </div>
    </div>
    <script type="module" src="JS/app.js"></script>
</body>
</html>
